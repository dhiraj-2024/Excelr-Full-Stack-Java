<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 03 Html Form </title>
</head>

<body>
    <section>
        <h1>Form input controls Examples</h1>
        <form>
            <label for="name">Full Name :</label>
            <input type="text" placeholder="Enter full name" id="name" name="name">
            <br>
            <br>

            <label for="email">Email :</label>
            <input type="email" placeholder="Enter your email" id="email" name="email">
            <br>
            <br>

            <label for="phone">Phone No :</label>
            <input type="tel" placeholder="8398439389" id="phone" name="phone">
            <br>
            <br>
            <label for="age">Age :</label>
            <input type="number" value="18" id="age" name="age">
            <br>
            <br>

            <label for="gender">Gender :</label>
            <br>
            <br>

            <input type="radio" placeholder="" id="genderm" name="gender">
            <label for="genderm">male</label>
            <input type="radio" placeholder="" id="genderf" name="gender">
            <label for="genderf">female</label>
            <input type="radio" placeholder="" id="gendero" name="gender">
            <label for="gendero">other</label>
            <br>
            <br>

            <label for="ocupation">Select Occupation :</label>
            <select name="occupation" id="ocupation">
                <option value="ug">Under Graduate</option>
                <option value="engi">Engineering</option>
                <option value="btech">B tech</option>
                <option value="pharmcy">Phramcy</option>
            </select>
            <br>
            <br>

            <label for="lang">Select Language :</label>
            <br>
            <br>

            <label for="langm">Marathi</label>
            <input type="checkbox" id="langm" name="language[]">
            <label for="lange">English</label>
            <input type="checkbox" id="lange" name="language[]">
            <label for="langh">Hindi</label>
            <input type="checkbox" id="langh" name="language[]">

            <br>
            <br>

            <label for="week">Week :</label>
            <input type="week" id="week" name="week">
            <br>
            <br>
            <label for="dob">DOB :</label>
            <input type="date" id="dob" name="dob">

            <br>
            <br>
            <label for="tims">Time : </label>
            <input type="time" name="time" id="times">

            <br>
            <br>
            <label for="files">Upload Document :</label>
            <input type="file" id="files" name="files">
            <br>
            <br>
            <label for="urls">Url :</label>
            <input type="url" name="urls" id="urls">
            <br>
            <br>
            <label for="raiting">Range :</label>
            <input type="range" name="raiting" id="raiting">
            <br>
            <br>
            <label for="message">Message :</label>
            <br>
            <br>
            <textarea name="message" id="message" cols="23" rows="5"
                placeholder="Enter Your Message here...."></textarea>

            <br>
            <br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </section>
</body>

</html>
