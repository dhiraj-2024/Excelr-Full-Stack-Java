<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 7 javascript loops</title>
</head>

<body>
    <script>
        console.log("Num 1 is greater")
        for (let i = 1; i <= 5; i++) {
            console.log(`For loop iterate ${i}`)
        }
        let i = 1;
        while (i <= 5) {
            console.log(`While loop iterate ${i}`)
            i++;
        }
        let j = 1;
        do {
           console.log(`Do While loop iterate ${j}`)
            j++;
        } while (j <= 5);

        console.log("It's Monday")
    </script>
</body>

</html>
