<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkar Login Page</title>
    <style>
        .container{
            width: 50%;
            height: 550px;
            padding: 50px;
            display: flex;

        }
        .box1{
            /* border: 2px solid black; */
            width: 50%;
            background-color: rgb(61, 61, 254);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .box1 p{
            font-family: Arial, Helvetica, sans-serif;
        }
        .box2{
           /* border: 2px solid black; */
            width: 50%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .subbox2{
        display: flex;
        flex-direction: column;
        gap: 40px;
        }
        input{
           border: none;
           border-bottom: 1px solid gray;
            width: 100%;
        }
        .box2 p{
            font-size: 11px;
        }
        .sp{
            color: rgb(60, 60, 255);
            font-weight: 700;

        }
        .btn{
            width: 100%;
            background-color: orangered;
            color: white;
            border: none;
            font-weight: 900;
            height: 30px;
        }
    </style>
</head>
<body>
    <header>

    </header>
    <main>
        <section class="container">
            <div class="box1">
                <div>
                    <h2>Login</h2>
                <p >Get access to your orders wishlist and Recommondations</p>
                </div>
                <div>
                    <img src="./images/limg.png" alt="loginsvg" width="100%">
                </div>
            </div>
            <div class="box2">
                <div class="subbox2">
                    <input type="email" placeholder="Enter Email/Mobile number">
                <p>By continuing you agree to <i>Flipkart's</i> <span class="sp">Terms of Use</span> and <span class="sp"> Privacy Policy</span></p>
                <button type="submit" class="btn">Request OTP</button>
                </div>
                <div>
                    <p style="color: rgb(118, 38, 255); text-align: center; font-family: Arial, Helvetica, sans-serif;">New to Flipkart? Create an account</p>
                </div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
