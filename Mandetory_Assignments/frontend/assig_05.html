<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Assignment 05 Flexbox Properties</title>
    <style>
        .container {
            background: #ff4ab1;
            background: linear-gradient(90deg, rgba(255, 74, 177, 1) 0%, rgba(127, 0, 212, 1) 100%, rgba(224, 83, 237, 1) 42%);
            height: 100vh;
            width: 80%;
            display: flex;
            padding: 50px;
            flex-wrap: wrap;
        }
        
        .mainbox {
            display: flex;
        }

        .mainbox2 {
            display: flex;
            justify-content: center;
        }

        .mainbox3 {
            display: flex;
            justify-content: flex-end;
        }

        .mainbox4 {
            display: flex;
            justify-content: space-evenly;
        }

        .mainbox5 {
            display: flex;
            justify-content: space-between;
        }

        .mainbox6 {
            display:flex;
            justify-content: space-around;
        }

        .mainbox7 {
           display: flex;
           justify-content: start;
        }

        .mainbox8 {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mainbox9 {
            display:flex;
            align-items: last baseline;

        }

        .mainbox10 {
    
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mainbox11 {
            
            display: flex;
            justify-content: center;
            align-items:start;
        }
.mainbox-g {
            background: #536407;

            border: 2px solid black;
            width: 200px;
            height: 200px;

        }

        .boxx {
            height: 50px;
            width: 50px;
            border: 2px solid white;
            background-color: rgb(20, 69, 246);
            color: white;
        }
    </style>
</head>
