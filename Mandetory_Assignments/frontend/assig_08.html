<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <div id="light"></div>
        <div id="box">
            <button id="btn1">On</button>
            <button id="btn2">Off</button>
        </div>
    </div>

    <script>
        const light = document.getElementById("light");
        light.style.borderRadius = "50%"
        light.style.width = "200px"
        light.style.height = "200px"
        light.style.border = "2px solid red"

        const onBtn = document.getElementById("btn1");

        onBtn.addEventListener("click", function () {
            light.style.backgroundColor = "yellow"
        });

        const offBtn = document.getElementById("btn2");
        offBtn.addEventListener("click", function () {
            light.style.backgroundColor = "white"
        })
        const box = document.getElementById("box");
        box.style.display = "flex"
        box.style.justifyContent = "center"
        box.style.gap = "10px"
    </script>
</body>

</html>
