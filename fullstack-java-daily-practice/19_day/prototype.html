<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>prototype in js</h1>

    <script>
        const obj1 = {
            fname : "dhiraj",
            lname : "rajput",
            getname() {
            return ` ${this.fname} ${this.lname}`
            }
        };          

        console.log(obj1.getname())
        // const obj2 = Object.create(obj1)
        const obj2 ={
            __proto__:obj1
        }
        console.log(obj2.lname)

        const obj3 ={
            __proto__:obj2
        }
        console.log(obj3.fname)
    </script>
</body>

</html>
