<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: rgb(153, 153, 153);
        }

        .header {
            height: 70px;
            width: 100%;
            padding: 0 20px;
            background-color: black;
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: relative;
        }

        /* Logo Gradient */
        .logo h1 a {
            text-decoration: none;

            background-clip: text;
            -webkit-text-fill-color: transparent;

            background-image: linear-gradient(240deg,
                    hsl(240deg 100% 20%),
                    hsl(319deg 100% 30%),
                    hsl(3deg 95% 61%),
                    hsl(40deg 100% 50%));
        }

        /* Nav Links */
        .nav-links {
            font-weight: 800;
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links li {
            cursor: pointer;
        }

        .span1 {
            margin-right: 5px;
            color: aqua;
        }

        /* Menu Icon */
        .menubar i {
            font-size: 22px;
            cursor: pointer;
            display: none;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .menubar i {
                display: block;
            }

            .nav {
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: black;
                display: none;
            }
            

            .nav.active {
                display: block;
            }

            .nav-links {
                flex-direction: column;
                padding: 20px;
                gap: 15px;
            }

        }
    </style>

</head>

<body>

    <header>
        <div class="header">

            <div class="logo">
                <h1><a href="#">Logo</a></h1>
            </div>

            <div class="nav " id="navMenu"  >
                <ul class="nav-links">
                    <li><span class="span1"><i class="fa-regular fa-house"></i></span>Home</li>
                    <li><span class="span1"><i class="fa-brands fa-whatsapp"></i></span>Contact</li>
                    <li><span class="span1"><i class="fa-brands fa-dribbble"></i></span>About</li>
                </ul>
            </div>

            <div class="menubar">
                <i class="fa-solid fa-bars" id="menuBtn"></i>
            </div>

        </div>
    </header>


    <script>

        const menuBtn = document.getElementById("menuBtn");
        const navMenu = document.getElementById("navMenu");

        menuBtn.addEventListener("click", () => {
            navMenu.classList.toggle("active");
        });

    </script>

</body>

</html>
