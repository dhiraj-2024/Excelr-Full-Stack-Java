<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

.parent {
    border: 2px solid red;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 10px;
}
    
.div1 {
    grid-column: span 2 / span 2;
    grid-row: span 3 / span 3;
}

.div2 {
    grid-row: span 3 / span 3;
    grid-column-start: 3;
    grid-row-start: 3;
}

.div3 {
    grid-row: span 3 / span 3;
    grid-column-start: 4;
    grid-row-start: 1;
}

.div4 {
    grid-column: span 2 / span 2;
    grid-column-start: 1;
    grid-row-start: 5;
}

.div5 {
    grid-row: span 2 / span 2;
    grid-column-start: 4;
    grid-row-start: 4;
}

.div6 {
    grid-column-start: 1;
    grid-row-start: 4;
}

.div7 {
    grid-column-start: 2;
    grid-row-start: 4;
}

.div8 {
    grid-row: span 2 / span 2;
    grid-column-start: 3;
    grid-row-start: 1;
}
.box{
    border: 2px solid black;
}
        
    </style>
</head>
<body>
    <div class="parent">
        <div class=" box div1">1</div>
        <div class=" box div2">2</div>
        <div class=" box div3">3</div>
        <div class=" box div4">4</div>
        <div class=" box div5">5</div>
        <div class=" box div6">6</div>
        <div class=" box div7">7</div>
        <div class=" box div8">8</div>
    </div>
</body>
</html>
