<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Forms</title>
</head>

<body>
    <header>

    </header>
    <main>
        <section>
            <h1>Learning forms in html</h1>
            <form>
                <fieldset>
                    <legend>Persnol information</legend>
                    <br>
                    <label for="fullname">Name:</label>
                    <input type="text" id="fullname" name="fullname" value="Pooja Nikam">
                    <br>
                    <br>
                    <label for="password">Pass :</label>
                    <input type="password" id="password" name="password">
                    <br>
                    <br>
                    <label for="phone">Phone No :</label>
                    <input type="tel" id="phone" name="phone" maxlength="10">
                    <br>
                    <br>
                    <label for="dob">DOB</label>
                    <input type="date" id="dob">
                    <br>
                    <br>
                </fieldset>


                <label for="week">week :</label>
                <input type="week">
                <br>
                <br>
                <label for="email">Email :</label>
                <input type="email" id="emai" placeholder="Enter your email" required>
                <br>
                <br>
                <input type="range">
                <br>
                <label for="gender">Gender:</label>
                <br>
                <br>
                <label for="male">Male</label>
                <input type="radio" id="male" name="gender">
                <label for="female">Female</label>
                <input type="radio" id="female" name="gender">
                <label for="other">Other</label>
                <input type="radio" id="other" name="gender">

                <br>
                <br>
                <label for="lang">Select your languages :</label>
                <br>
                <label for="hindi">Hindi</label>
                <input type="checkbox">
                <label for="english">English</label>
                <input type="checkbox">
                <label for="Marathi">Marathi</label>
                <input type="checkbox">
                <br>
                <br>
                <label for="clg">Select Clg:</label>
                <select name="clg" id="clg">
                    <option value="">met</option>
                    <option value="">KKw</option>
                    <option value="">met</option>
                    <option value="">KKw</option>
                    <option value="">met</option>
                    <option value="">KKw</option>
                </select>
                <br>
                <br>
                <label for="msg">Message :</label>
                <textarea name="msg" id="msg" cols="30" placeholder="Enter your msg here....." rows="5"></textarea>
                <br>
                <br>
                <input type="file" name="" id="">
                <br>
                <input type="url" name="" id="">
                <br>
                <button type="submit">submit</button>
                <button type="reset">reset</button>
                <button type="button">button</button>
            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
