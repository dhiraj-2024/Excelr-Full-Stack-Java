<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header >
        <ul class="nav-list">
            <li><a href="./index.html">Home</a></li>
        <li><a href="./about.html">About us</a></li>
        <li><a href="./contact.html">Contact</a></li>

        <li><a href="./register.html">Register</a></li>

    </ul>
    </header>  
    <h1>Employee Registeration Form</h1>
    <form action="">
        <label for="name">Name :</label>
        <input type="text" id="name" placeholder="Enter Your Name" required>
        <br>
        <br>
        <label for="password">Password :</label>
        <input type="password" id="password" placeholder="Enter Your Password" required>
        <br>
        <br>
         <label for="email">Email :</label>
        <input type="email" id="email" placeholder="Enter Your Email" required>
        <br>
        <br>

        <fieldset>
            <legend>
                Gender :
            </legend>
            <label for="Gender"> Male</label>
            <input type="radio" value="Gender">
            <label for="Gender"> Female</label>
            <input type="radio" value="Gender">
        </fieldset>
        <br>
        <br>
         <label for="phone">Mobile No :</label>
        <input type="tel" id="phone" placeholder="Enter Your phone no" maxlength="10" required>
        <br>
        <br>
         <label for="address">Adress :</label>
        <input type="text" id="address" placeholder="Enter Your adress"  required>
        <br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
