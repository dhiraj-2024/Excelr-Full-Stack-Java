        function cal(op){
            let num1 = Number(document.getElementById("fnum").value);
            let num2 = Number(document.getElementById("snum").value);
            let result;

            if (op === "add") result = num1 + num2 ;
            if (op === "sub") result = num1 - num2 ;
            if (op === "mult") result = num1 * num2 ;
            if (op === "div") result = num1 / num2 ;

            document.getElementById("result").innerHTML = result;
        }
