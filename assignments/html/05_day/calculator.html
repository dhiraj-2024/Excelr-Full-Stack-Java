<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        th,td{
            border: 2px solid black;
            padding: 10px 20px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 900;
            cursor: pointer;
            
            
    
        }
        td:hover{
            background-color: rgb(165, 230, 255);
        }
        table{
            border: 2px solid black;
            border-radius: 20px;
            border-collapse: collapse;
            /* border-spacing: 10px; */

            
        }
    </style>
</head>
<body>
    <section>

        <table>
            <caption>Calculator</caption>
            <tbody>
                <tr style="height: 50px; ">
                    <th colspan="4" style="background-color: black; color: white;"></th>
                </tr>
            </tbody>
            <tr>
                <td>+</td>
                <td>-</td>
                <td>*</td>
                <td>%</td>
            </tr>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
                <td rowspan="4" style="background-color: orange; ">=</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
                <!-- <td></td> -->
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <!-- <td></td> -->
            </tr>
            <tr>
                <td>0</td>
                <td>.</td>
                <td>AC</td>
                <!-- <td></td> -->
            </tr>
        </table>
    </section>
    
</body>
</html>
